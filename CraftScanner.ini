; ============================================================
; CraftScanner - configuration
; Changes require a game restart to take effect on hotkey binding.
; Filter values are re-read on each hotkey press.
; ============================================================

[Settings]
; Master switch. 0 = mod does nothing.
Enabled=1
; Verbose log to UE4SS.log.
VerboseLog=0
; Hotkey: F1..F12, A..Z, 0..9, SPACE, TAB, ENTER, ESCAPE, INSERT,
; DELETE, HOME, END, PGUP, PGDOWN, UP, DOWN, LEFT, RIGHT.
Hotkey=F2
; How long the notification stays on screen (seconds).
DurationSec=15.0
; Maximum number of resource lines to print. Extras are summarized.
MaxLines=40

[Filter]
; 1 = show everything found, ignoring IncludeTypes/IncludeItemIds.
ShowAll=0
; GameplayTag substrings to include (comma-separated). Case-sensitive.
; Leave both IncludeTypes and IncludeItemIds empty to default to
; "Material" + "Tool".
IncludeTypes=Material,Tool
; Explicit item-id whitelist (comma-separated). Combined with IncludeTypes
; using OR. Useful for one-off items whose ItemType doesn't match.
IncludeItemIds=

[Display]
Title=📦 Crafting Resources
; 1 = sort lines by count (descending). 0 = sort alphabetically.
SortByCount=1
; Reserved for future use.
ShowEmpty=0